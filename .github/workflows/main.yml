name: Build Debug APK

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Gradle with Caching (No wrapper needed)
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'
          cache-read-only: false

      - name: Build Debug APK
        working-directory: ./smartclipboard
        run: gradle assembleDebug --build-cache --configuration-cache

      - name: Upload Debug APK
        uses: actions/upload-artifact@v4
        with:
          name: SmartClipboard-Debug-APK
          path: smartclipboard/app/build/outputs/apk/debug/*.apk
